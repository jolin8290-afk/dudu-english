<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>嘟嘟英文冒險島</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{--ink:#16233a;--card:#ffffff;--gold:#ffc83d;--good:#22a85a;--bad:#e5484d;--sea:#1565c0;--muted:#5b6b82}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:'Fredoka','Noto Sans TC',system-ui,sans-serif;color:var(--ink);min-height:100vh;
  background:radial-gradient(circle at 20% 10%,#7fd4ff 0,transparent 40%),radial-gradient(circle at 80% 90%,#42a5f5 0,transparent 45%),linear-gradient(160deg,#0b3d91,#1976d2 45%,#29b6f6);background-attachment:fixed}
button{font-family:inherit;cursor:pointer;color:inherit}
#app{max-width:980px;margin:0 auto;padding:14px 16px 40px}
h1,h2,h3{margin:.2em 0}
.panel{background:var(--card);border-radius:24px;padding:20px;box-shadow:0 10px 0 rgba(0,0,0,.15),0 20px 40px rgba(0,0,0,.2)}
.center{text-align:center}
.btn{border:0;border-radius:16px;padding:12px 18px;font-size:17px;font-weight:700;background:var(--gold);box-shadow:0 5px 0 #c99410;transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #c99410}
.btn.big{font-size:22px;padding:16px 34px;margin-top:18px}
.btn.blue{background:#4fc3f7;box-shadow:0 5px 0 #1e88b8}
.btn.red{background:#ff7a7a;box-shadow:0 5px 0 #c94444;color:#fff}
.btn.green{background:#5ad18a;box-shadow:0 5px 0 #2a9a58;color:#fff}
.btn.ghost{background:#eef3fa;box-shadow:0 5px 0 #c3cfdf}
.btn:disabled{opacity:.5}
.back{border:0;background:#eef3fa;border-radius:12px;padding:8px 14px;font-size:15px;font-weight:700}
.sub{color:var(--muted)}
input{font-family:inherit;font-size:20px;padding:10px 14px;border-radius:14px;border:3px solid #cfdcec;width:min(320px,100%);text-align:center}
label{display:block;margin:16px 0 8px;font-weight:700}
.logo{font-size:72px;animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-10px)}}
.heroes{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.hero{border:4px solid #e3ebf5;background:#f7faff;border-radius:18px;padding:12px 6px;display:flex;flex-direction:column;align-items:center;gap:2px}
.hero span{font-size:48px}.hero small{color:var(--muted);font-size:12px}
.hero.sel{border-color:var(--gold);background:#fff7dc;transform:scale(1.04)}
@media(max-width:560px){.heroes{grid-template-columns:repeat(2,1fr)}}

/* top bar */
.topbar{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.95);border-radius:20px;padding:10px 14px;margin-bottom:14px;box-shadow:0 6px 0 rgba(0,0,0,.12)}
.av{font-size:40px;line-height:1;position:relative;white-space:nowrap}
.av small{font-size:20px}
.tb-name{font-weight:700;font-size:18px}
.xp{height:10px;background:#e3ebf5;border-radius:6px;overflow:hidden;width:140px;margin-top:4px}
.xp div{height:100%;background:linear-gradient(90deg,#7c4dff,#40c4ff)}
.tb-right{margin-left:auto;display:flex;gap:10px;font-weight:700;font-size:18px;flex-wrap:wrap;justify-content:flex-end}
.chip{background:#fff3cc;border-radius:12px;padding:4px 10px}
.chip.s{background:#e7f6ff}

/* map */
.maptitle{color:#fff;text-align:center;text-shadow:0 3px 0 rgba(0,0,0,.25);margin:4px 0 12px}
.mapgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
@media(max-width:760px){.mapgrid{grid-template-columns:repeat(2,1fr)}}
.isl{border:0;background:none;padding:0;position:relative;text-align:center;animation:bob 4s ease-in-out infinite}
.isl:nth-child(2n){animation-delay:-1.5s}.isl:nth-child(3n){animation-delay:-2.6s}
.isl .blob{width:min(170px,100%);aspect-ratio:1.3;margin:0 auto;border-radius:50% 50% 46% 54%/60% 55% 45% 40%;background:radial-gradient(ellipse at 50% 45%,var(--c) 0,var(--c) 52%,#ffe08a 53%,#ffe08a 64%,rgba(179,229,252,.9) 65%,rgba(179,229,252,0) 72%);display:flex;align-items:center;justify-content:center;font-size:56px;box-shadow:0 12px 0 rgba(0,0,0,.18);transition:transform .15s}
.isl:hover .blob{transform:scale(1.06) rotate(-2deg)}
.isl .nm{display:inline-block;margin-top:10px;background:#fff;border-radius:12px;padding:5px 10px;font-weight:700;font-size:15px;box-shadow:0 4px 0 rgba(0,0,0,.15)}
.isl .st{display:block;font-size:16px;margin-top:4px;letter-spacing:2px;filter:drop-shadow(0 2px 0 rgba(0,0,0,.25))}
.isl .no{position:absolute;top:-6px;left:6px;background:#16233a;color:#fff;border-radius:50%;width:30px;height:30px;line-height:30px;font-weight:700}
.tools{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:26px}

/* island menu */
.isl-head{display:flex;gap:14px;align-items:center;background:linear-gradient(120deg,var(--c),#fff 140%);border-radius:18px;padding:14px;margin:12px 0}
.isl-head .be{font-size:60px}
.isl-head p{margin:0;color:#24324a}
.modes{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media(max-width:760px){.modes{grid-template-columns:repeat(2,1fr)}}
.mode{border:0;border-radius:18px;padding:16px 10px;background:#f2f7ff;box-shadow:0 6px 0 #cbd8ea;display:flex;flex-direction:column;align-items:center;gap:4px}
.mode:active{transform:translateY(3px);box-shadow:0 3px 0 #cbd8ea}
.mode span{font-size:44px}.mode b{font-size:19px}.mode small{color:var(--muted);font-size:13px}
.mode em{font-style:normal;font-size:13px;color:var(--good);font-weight:700}
.mode.fight{background:#fff0e6;box-shadow:0 6px 0 #f2b48a}
details.wordlist{margin-top:18px;background:#f8fafd;border-radius:16px;padding:10px 14px}
details summary{font-weight:700;cursor:pointer;font-size:17px}
.wl{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:6px;margin:10px 0}
.wl button,.sl button{border:0;background:#fff;border-radius:10px;padding:8px 10px;text-align:left;box-shadow:0 2px 0 #dde5f0;font-size:15px}
.wl button i{font-style:normal;color:var(--muted);font-size:13px;margin-left:6px}
.sl{display:flex;flex-direction:column;gap:6px;margin:8px 0}

/* battle */
.battle{background:linear-gradient(#2a1b5c,#4b2a8a 50%,#7a4fd1);border-radius:24px;padding:14px;color:#fff;box-shadow:0 10px 0 rgba(0,0,0,.2);position:relative;overflow:hidden}
.bt-top{display:flex;align-items:center;gap:10px}
.bt-top .back{background:rgba(255,255,255,.2);color:#fff}
.wave{font-weight:700}
.combo{margin-left:auto;font-weight:700;font-size:18px}
.combo.hot{color:#ffd54f;animation:pulse .6s infinite}
@keyframes pulse{50%{transform:scale(1.15)}}
.arena{position:relative;text-align:center;padding:6px 0 4px;min-height:190px}
.mon{font-size:110px;line-height:1.1;display:inline-block;animation:mbob 1.6s ease-in-out infinite;filter:drop-shadow(0 10px 8px rgba(0,0,0,.4))}
.mon.boss{font-size:140px;filter:drop-shadow(0 0 18px #ff4d6d)}
@keyframes mbob{50%{transform:translateY(-8px) rotate(3deg)}}
.mon.hit{animation:hit .45s}
@keyframes hit{0%{transform:translateX(0)}20%{transform:translateX(-18px) rotate(-8deg);filter:brightness(3)}40%{transform:translateX(16px)}60%{transform:translateX(-10px)}100%{transform:translateX(0)}}
.mon.dead{animation:dead .8s forwards}
@keyframes dead{to{transform:scale(0) rotate(360deg);opacity:0}}
.mname{font-weight:700;font-size:18px}
.hp{width:min(360px,80%);height:18px;background:rgba(0,0,0,.35);border-radius:10px;margin:6px auto;overflow:hidden;border:2px solid rgba(255,255,255,.5)}
.hp div{height:100%;background:linear-gradient(90deg,#ff5252,#ffb74d);transition:width .4s}
.fx{position:absolute;left:50%;top:40%;font-size:70px;pointer-events:none;animation:fx .7s forwards}
@keyframes fx{from{transform:translate(-50%,120px) scale(.4);opacity:1}to{transform:translate(-50%,-30px) scale(1.6);opacity:0}}
.dmg{position:absolute;left:58%;top:20%;font-size:34px;font-weight:700;color:#ffeb3b;text-shadow:0 3px 0 #b71c1c;animation:dmg .9s forwards;pointer-events:none}
@keyframes dmg{to{transform:translateY(-60px);opacity:0}}
.battle.hurt{animation:hurt .4s}
@keyframes hurt{25%{transform:translateX(-10px);box-shadow:0 0 0 6px #ff1744 inset}75%{transform:translateX(10px)}}
.qbox{background:#fff;color:var(--ink);border-radius:20px;padding:16px;margin-top:8px}
.qt{font-weight:700;color:#6a4fc7;margin-bottom:8px}
.qbig{font-size:34px;font-weight:700;text-align:center;margin:6px 0 12px;word-break:break-word}
.qbig .say{font-size:22px;vertical-align:middle}
.say{border:0;background:#e9f3ff;border-radius:12px;padding:6px 12px;font-size:20px;box-shadow:0 3px 0 #bcd6f2}
.bigsay{font-size:54px;padding:10px 30px;border-radius:20px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{border:0;border-radius:16px;padding:14px 10px;font-size:21px;font-weight:700;background:#f1f5fb;box-shadow:0 5px 0 #c9d5e6;min-height:62px}
.opt:active{transform:translateY(3px);box-shadow:0 2px 0 #c9d5e6}
.opt.right{background:#c9f7d9;box-shadow:0 5px 0 #2a9a58}
.opt.wrong{background:#ffd1d1;box-shadow:0 5px 0 #c94444}
.gq{font-size:21px;line-height:1.5;text-align:center;margin-bottom:12px}
.gq .q1{color:var(--muted);font-size:18px}
.gq .q2{font-weight:700}
.blank{display:inline-block;min-width:80px;border-bottom:4px solid #7c4dff;color:#7c4dff}
.feedback{text-align:center;font-weight:700;font-size:19px;margin-top:10px;min-height:28px}
.feedback.ok{color:var(--good)}.feedback.no{color:var(--bad)}
.me{display:flex;align-items:center;justify-content:space-between;margin-top:10px}
.hearts{font-size:24px;letter-spacing:2px}
.rule{text-align:center;color:var(--muted);font-weight:700}

/* spell widget */
.slots{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;margin:6px 0 14px}
.slot{width:44px;height:54px;border-radius:12px;background:#f1f5fb;border:3px dashed #b9c8dc;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:700}
.slot.f{border-style:solid;border-color:#7c4dff;background:#f3eeff}
.slot.ok{border-color:var(--good);background:#c9f7d9}.slot.no{border-color:var(--bad);background:#ffd1d1}
.tiles{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
.tile{width:52px;height:56px;border:0;border-radius:14px;font-size:28px;font-weight:700;background:#ffe9a8;box-shadow:0 5px 0 #d4a72c}
.tile:disabled{opacity:.25}
.sp-tools{display:flex;justify-content:center;gap:8px;margin-top:12px}
@media(max-width:480px){.slot{width:36px;height:46px;font-size:24px}.tile{width:44px;height:50px;font-size:24px}.qbig{font-size:28px}.opt{font-size:18px}}

/* cards */
.card3d{perspective:900px;margin:14px auto;width:min(420px,100%);height:250px;cursor:pointer}
.card3d .in{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.card3d.flip .in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:40px;font-weight:700;padding:16px;text-align:center;box-shadow:0 8px 0 rgba(0,0,0,.12)}
.face.f{background:linear-gradient(150deg,#fff,#e8f4ff)}
.face.b{background:linear-gradient(150deg,#fff8e1,#ffe0b2);transform:rotateY(180deg)}
.face small{font-size:15px;color:var(--muted);font-weight:500;margin-top:10px}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.prog{height:12px;background:#e3ebf5;border-radius:8px;overflow:hidden;margin:8px 0}
.prog div{height:100%;background:linear-gradient(90deg,#5ad18a,#40c4ff);transition:width .3s}

/* speak */
.sp-target{font-size:34px;font-weight:700;text-align:center;margin:16px 0 4px;line-height:1.35}
.sp-target .w{display:inline-block;margin:0 4px;padding:0 4px;border-radius:8px}
.sp-target .w.ok{background:#c9f7d9}.sp-target .w.no{background:#ffd1d1}
.sp-zh{text-align:center;color:var(--muted);font-size:18px}
.mic{font-size:26px;padding:16px 30px;border-radius:999px;border:0;background:linear-gradient(#ff6b6b,#e53935);color:#fff;box-shadow:0 6px 0 #9e1f1f;font-weight:700}
.mic.on{animation:pulse 1s infinite;background:linear-gradient(#ffb74d,#fb8c00)}
.heard{text-align:center;margin-top:12px;font-size:18px;min-height:26px}
.bigstars{text-align:center;font-size:44px;min-height:56px}

/* result & misc */
.result .mon-row{font-size:60px;margin:10px 0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.stats div{background:#f2f7ff;border-radius:14px;padding:10px}
.stats b{display:block;font-size:26px}
.dex{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin-top:12px}
.dex div{background:#f5f8fc;border-radius:16px;padding:10px;text-align:center}
.dex span{font-size:52px;display:block}
.dex .lock span{filter:brightness(0) opacity(.35)}
.dex small{color:var(--muted)}
.shop{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;margin-top:12px}
.shop div{background:#f5f8fc;border-radius:16px;padding:12px;text-align:center}
.shop span{font-size:52px;display:block}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(120px);background:#16233a;color:#fff;padding:12px 20px;border-radius:16px;font-weight:700;transition:transform .3s;z-index:9;max-width:90vw;text-align:center}
#toast.show{transform:translateX(-50%) translateY(0)}
#mbtn{position:fixed;right:14px;bottom:14px;z-index:10;width:56px;height:56px;border-radius:50%;border:0;font-size:26px;background:#fff;box-shadow:0 5px 0 rgba(0,0,0,.25)}
#mbtn.off{opacity:.55;filter:grayscale(1)}
#mbtn.on{animation:pulse 1.2s infinite}
.confetti{position:fixed;top:-40px;font-size:30px;pointer-events:none;animation:fall linear forwards;z-index:8}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
/* 球員造型與晉級 */
.ava{display:inline-block;vertical-align:middle;overflow:visible}
.ava .aura{animation:aura 2s ease-in-out infinite;transform-origin:60px 80px}
@keyframes aura{50%{opacity:.55;transform:scale(1.08)}}
.ava .spin{animation:spin 1.2s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes spin{to{transform:rotate(360deg)}}
.av{display:inline-flex;align-items:flex-end;gap:2px}
.heroes{grid-template-columns:repeat(3,1fr)}
.evo{display:flex;align-items:center;justify-content:center}
.evo .arrow{font-size:20px;color:var(--muted)}
.tb-title{font-size:13px;color:#7c4dff;font-weight:700}
.me-l{display:flex;align-items:center;gap:8px}
.me-l small{opacity:.85}
.modal{position:fixed;inset:0;background:rgba(10,20,50,.7);display:flex;align-items:center;justify-content:center;z-index:7;padding:16px}
.promo{max-width:420px;width:100%;animation:pop .5s}
@keyframes pop{from{transform:scale(.5);opacity:0}}
.promo-ava{animation:bob 2s ease-in-out infinite}
.locker{display:flex;gap:18px;align-items:center;flex-wrap:wrap;background:linear-gradient(120deg,#e8f5e9,#e3f2fd);border-radius:20px;padding:14px}
.locker-ava{flex:none}
.ranks{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.ranks div{background:#f5f8fc;border-radius:14px;padding:8px 4px;text-align:center;font-size:13px}
.ranks svg{display:block;margin:0 auto}.ranks b{display:block}
.ranks small{display:block;color:var(--muted);font-size:11px}
.ranks .lock svg{filter:grayscale(1) brightness(.4) opacity(.5)}
.ranks .cur{outline:3px solid var(--gold);background:#fff7dc}
@media(max-width:700px){.ranks{grid-template-columns:repeat(3,1fr)}}
@media(max-width:560px){.heroes{grid-template-columns:1fr}}
.help li{margin:6px 0;line-height:1.6}
.tip{background:#fff7dc;border-radius:14px;padding:10px 14px;margin:10px 0}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>
<button id="mbtn" onclick="toggleMusic()" title="音樂開關">🎵</button>
<script>
/* =========================================================
   嘟嘟英文冒險島 — 何嘉仁 四上（2026/8/31–11/6 聯絡簿內容）
   ========================================================= */

/* 三種球員，每種 6 階晉級（等級到了就換新球衣、新光環、新絕招） */
const SPORTS=[
  {n:'足球員',ball:'⚽',cheer:'Goal!',
   titles:['足球新秀','校隊前鋒','明星射手','國家隊王牌','世界足球巨星','傳奇球王'],
   skills:['射門','香蕉球','火焰射門','閃電倒掛金鉤','龍捲風射門','流星無敵射門']},
  {n:'棒球員',ball:'⚾',cheer:'Home run!',
   titles:['棒球新秀','校隊強打','明星打者','國家隊第四棒','世界棒球巨星','傳奇全壘打王'],
   skills:['安打','二壘安打','全壘打','火焰全壘打','雷霆滿貫砲','宇宙場外全壘打']},
  {n:'籃球員',ball:'🏀',cheer:'Slam dunk!',
   titles:['籃球新秀','校隊控衛','明星射手','國家隊王牌','世界籃球巨星','傳奇灌籃王'],
   skills:['上籃','三分球','灌籃','風火輪灌籃','空中飛人暴扣','宇宙無敵暴扣']}
];
const RANK_LV=[1,3,6,10,15,20];
const SHOP=[
  ['👟','閃電球鞋',30],['🕶️','酷炫墨鏡',40],['🏅','金牌',60],['🏆','冠軍獎盃',100],
  ['🐶','吉祥物小狗',120],['🦁','吉祥物獅子',160],['🐲','吉祥物神龍',220]
];

/* 每座島的資料：words=[英文,中文]、spell=要背的單字、grammar=[問句, 答句(___), 答案, 選項]、past=[原形,過去式,[錯誤選項]]、read=唸唸看句子、monsters=[emoji,名字] */
const ISLANDS=[
{id:'i1',name:'彩色文具島',emoji:'🎨',color:'#ff8a65',sub:'8/31～9/4、9/21・需要什麼？ need some / any',
 words:[['blue chalk','藍色粉筆'],['brown tape','棕色膠帶'],['gray clay','灰色黏土'],['green paper','綠色色紙'],['orange paint','橘色顏料'],['purple yarn','紫色毛線'],['red glitter','紅色亮片'],['colored pencils','色鉛筆'],['gold stickers','金色貼紙'],['paintbrushes','畫筆'],['scissors','剪刀'],['silver stars','銀色星星'],['staplers','釘書機'],['tissues','衛生紙'],['yellow straws','黃色吸管']],
 spell:[['see','看見'],['cute','可愛的'],['bird','鳥'],['blue','藍色'],['thin','瘦的'],['fat','胖的'],['short','矮的'],['tall','高的'],['red','紅色'],['yellow','黃色'],['boat','船']],
 grammar:[
  ['What do you need?','I ___ some blue chalk.','need',['need','needs','needing']],
  ['What does your brother need?','He ___ some colored pencils.','needs',['need','needs','needing']],
  ['Do you need ___ orange paint?','Yes, I need some orange paint.','any',['any','many','a']],
  ['Does Wendy need any tissues?','No, she ___ need any tissues.',"doesn't",["don't","doesn't","isn't"]],
  ['Do you and Arthur need any purple yarn?','No, we ___ need any purple yarn.',"don't",["don't","doesn't","aren't"]],
  ['Does James need any staplers?','Yes, he needs ___ staplers.','some',['some','any','a']],
  ['What does Anna have?','She ___ some apples.','has',['have','has','is']],
  ['What do the boys need?','They need a little ___ clay.','gray',['gray','scissors','tissues']]
 ],
 read:['Jack has a cute dog named Pete.','The cute bird flies up into a tree.','I need some blue chalk.','She needs a lot of gold stickers.'],

function load(){try{const t=localStorage.getItem(SAVE_KEY);if(t)return Object.assign(defaultSave(),JSON.parse(t));}catch(e){}return defaultSave();}
function save(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(S));}catch(e){}}

if(S.hero!=null&&S.hero>2)S.hero=0;S.wear=S.wear.filter(i=>i<SHOP.length);S.owned=S.owned.filter(i=>i<SHOP.length);

/* ---------- 聲音：英文朗讀＋音效 ---------- */
let VOICE=null;
function pickVoice(){if(!('speechSynthesis' in window))return;const vs=speechSynthesis.getVoices();VOICE=vs.find(v=>/^en[-_]US/i.test(v.lang)&&/Google|Jenny|Aria|Samantha|Zira/i.test(v.name))||vs.find(v=>/^en[-_]US/i.test(v.lang))||vs.find(v=>/^en/i.test(v.lang))||null;}
if('speechSynthesis' in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice;}
function say(t,rate=.9){if(!('speechSynthesis' in window)||!t)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-US';if(VOICE)u.voice=VOICE;u.rate=rate;duck(true);clearTimeout(say.t);say.t=setTimeout(()=>duck(false),6000);u.onend=u.onerror=()=>{clearTimeout(say.t);duck(false);};speechSynthesis.speak(u);}
document.addEventListener('click',e=>{const b=e.target.closest('[data-say]');if(b){e.stopPropagation();say(b.dataset.say,b.dataset.slow?.55:.9);}},true);
let AC=null;
function sfx(type){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const seq={hit:[[660,.06],[990,.12]],bad:[[220,.15],[150,.25]],win:[[523,.12],[659,.12],[784,.12],[1047,.35]],coin:[[1200,.05],[1700,.1]],boss:[[110,.2],[98,.3]]}[type];let t=AC.currentTime;seq.forEach(([f,d])=>{const o=AC.createOscillator(),g=AC.createGain();o.type=type==='bad'||type==='boss'?'sawtooth':'square';o.frequency.value=f;g.gain.setValueAtTime(.07,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d);t+=d;});}catch(e){}}

/* ---------- 背景音樂：瀏覽器即時合成的原創配樂 ---------- */
function ensureAC(){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();}catch(e){}return AC;}
const mtof=m=>440*Math.pow(2,(m-69)/12);
// 每首：速度、4 個和弦、16 格節奏（x=打、.=休息），bass r=根音 o=高八度，arp 數字=和弦第幾個音
const TRACKS={
  map:{bpm:112,vol:.55,wave:'triangle',bassWave:'triangle',arpUp:12,
    chords:[[60,64,67],[55,59,62],[57,60,64],[53,57,60]],
    kick:'x.......x.......',snare:'....x.......x...',hat:'..x...x...x...x.',
    bass:'r...r.o.r...r.o.',arp:'0.1.2.1.0.1.2.3.'},
  battle:{bpm:150,vol:.7,wave:'square',bassWave:'sawtooth',arpUp:12,
    chords:[[57,60,64],[53,57,60],[55,59,62],[52,56,59]],
    kick:'x...x...x.x.x...',snare:'....x.......x...',hat:'x.x.x.x.x.x.x.xx',
    bass:'r.r.r.r.o.r.r.r.',arp:'0121012101210121'},
  boss:{bpm:168,vol:.8,wave:'sawtooth',bassWave:'sawtooth',arpUp:12,
    chords:[[57,60,64],[58,62,65],[57,60,64],[52,56,59]],
    kick:'x.x.x.x.x.x.x.x.',snare:'....x.......x.xx',hat:'xxxxxxxxxxxxxxxx',
    bass:'rrrrrrrorrrrrrro',arp:'0102010201020102',roll:true}
};
let MG=null,NOISE=null;
const MT={name:null,want:null,track:null,step:0,next:0,timer:null};
function mNode(){ensureAC();if(!MG){MG=AC.createGain();MG.gain.value=.14;MG.connect(AC.destination);
  NOISE=AC.createBuffer(1,AC.sampleRate*.5,AC.sampleRate);const d=NOISE.getChannelData(0);for(let k=0;k<d.length;k++)d[k]=Math.random()*2-1;}return MG;}
function tone(wave,f,t,dur,vol,cut){const o=AC.createOscillator(),g=AC.createGain();o.type=wave;o.frequency.value=f;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0008,t+dur);
  if(cut){const fl=AC.createBiquadFilter();fl.type='lowpass';fl.frequency.value=cut;o.connect(fl);fl.connect(g);}else o.connect(g);g.connect(MG);o.start(t);o.stop(t+dur+.02);}
function noise(t,dur,vol,hp){const n=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();n.buffer=NOISE;f.type='highpass';f.frequency.value=hp;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0008,t+dur);n.connect(f);f.connect(g);g.connect(MG);n.start(t);n.stop(t+dur+.02);}
function kick(t,v){const o=AC.createOscillator(),g=AC.createGain();o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(45,t+.12);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+.18);o.connect(g);g.connect(MG);o.start(t);o.stop(t+.2);}
function playStep(T,step,t,sp){
  const bar=(step>>4)%4,i=step%16,ch=T.chords[bar],v=T.vol;
  if(T.kick[i]==='x')kick(t,.9*v);
  if(T.snare[i]==='x'||(T.roll&&bar===3&&i>=12)){noise(t,.12,.35*v,1500);tone('triangle',190,t,.08,.25*v);}
  if(T.hat[i]==='x')noise(t,.035,.12*v,7000);
  const b=T.bass[i];if(b!=='.')tone(T.bassWave,mtof(ch[0]-24+(b==='o'?12:0)),t,sp*1.6,.35*v,900);
  const a=T.arp[i];if(a!=='.'){const n=a==='3'?ch[0]+12:ch[+a];tone(T.wave,mtof(n+T.arpUp),t,sp*.9,.13*v,T.wave==='triangle'?0:2600);}
}
function tick(){if(!MT.track||!AC)return;const sp=60/MT.track.bpm/4;if(MT.next<AC.currentTime-.05)MT.next=AC.currentTime+.05;while(MT.next<AC.currentTime+.12){playStep(MT.track,MT.step,MT.next,sp);MT.next+=sp;MT.step=(MT.step+1)%64;}}
function stopMusic(){MT.name=null;MT.track=null;if(MT.timer){clearInterval(MT.timer);MT.timer=null;}}
// 切換場景音樂；name=null 代表安靜（例如發音挑戰要用麥克風）
function music(name){
  MT.want=name;updMbtn();

  MT.name=name;MT.track=TRACKS[name];MT.step=0;MT.next=AC.currentTime+.08;
  if(!MT.timer)MT.timer=setInterval(tick,25);
}

function updMbtn(){const b=$('#mbtn');if(!b)return;b.textContent=S.music===false?'🔇':'🎵';b.classList.toggle('off',S.music===false);}

function duck(on){if(!MG||!AC)return;MG.gain.cancelScheduledValues(AC.currentTime);MG.gain.setTargetAtTime(on?.035:.14,AC.currentTime,.08);}

/* ---------- 題目產生器 ---------- */
function opts(ans,pool){const p=[...new Set(pool.filter(x=>x!==ans))];return shuffle([ans,...shuffle(p).slice(0,3)]);}
function wordQ(type,w,isl){
  let pool=isl.words.concat(isl.spell||[]);if(pool.length<6)pool=pool.concat(ALLWORDS);
  const log={k:'w:'+w[0],en:w[0],zh:w[1]};
  if(type==='listen')return {type,title:'🎧 聽聽看，是哪一個？',say:w[0],options:opts(w[0],pool.map(x=>x[0])),answer:w[0],after:w[0],log};
  if(type==='zh2en')return {type,title:'🔤 這個英文怎麼說？',big:w[1],options:opts(w[0],pool.map(x=>x[0])),answer:w[0],after:w[0],log};
  if(type==='en2zh'){const zp=pool.filter(x=>x[1]!==w[1]&&x[0].toLowerCase()!==w[0].toLowerCase()).map(x=>x[1]);return {type,title:'🈶 這是什麼意思？',bigEn:w[0],options:opts(w[1],zp),answer:w[1],after:w[0],log};}
  if(type==='spell')return {type,title:'✏️ 把字母排出來',big:w[1],say:w[0],answer:w[0],log};
}
function grammarQ(ii,gi){const [q,a,ans,op]=ISLANDS[ii].grammar[gi];return {type:'grammar',title:'📝 選出正確的字',q,a,options:shuffle(op),answer:ans,after:(q.includes('___')?q.replace('___',ans):q)+' '+(a.includes('___')?a.replace('___',ans):a),log:{k:'g:'+ii+':'+gi,en:(a.includes('___')?a.replace('___',ans):a),zh:'句型'}};}
function pastQ(p){const op=shuffle([p[1],...p[2]]);return {type:'past',title:'⏪ 過去式是哪一個？',bigEn:p[0]+' → ?',sayIt:p[0],options:op,answer:p[1],after:p[0]+', '+p[1],log:{k:'p:'+p[0],en:p[0]+' → '+p[1],zh:'過去式'}};}
function rhymeQ(isl,gp){
  const [a,b]=shuffle(gp.w);
  const others=[];isl.phonics.forEach(g=>{if(g!==gp)g.w.forEach(w=>{if(!gp.t.test(w[0]))others.push(w[0]);});});
  return {type:'rhyme',title:'🔤 發音規則',bigEn:a[0],rule:`哪一個字跟 ${a[0]} 一樣是「${gp.rule}」？`,options:shuffle([b[0],...shuffle(others).slice(0,3)]),answer:b[0],after:a[0]+', '+b[0],log:{k:'w:'+b[0],en:b[0],zh:b[1]}};
}
function findPast(base){for(const isl of ISLANDS)for(const p of (isl.past||[]))if(p[0]===base)return p;return null;}
function findWord(en){return ALLWORDS.find(w=>w[0]===en);}

// 依島嶼建出「出題器」清單（每個元素是一個會產生題目的函式）
function buildBank(isl,ii){
  const b={listen:[],zh2en:[],en2zh:[],spell:[],grammar:[],past:[],rhyme:[]};
  if(isl.review){
    isl.keys.forEach(k=>{
      if(k.startsWith('w:')){const w=findWord(k.slice(2));if(!w)return;const t=/^[a-z]+$/i.test(w[0])&&w[0].length<=9?['zh2en','listen','spell']:['zh2en','listen','en2zh'];const ty=t[Math.random()*3|0];b[ty].push(()=>wordQ(ty,w,isl));}
      else if(k.startsWith('g:')){const [,a,c]=k.split(':');if(ISLANDS[+a]&&ISLANDS[+a].grammar[+c])b.grammar.push(()=>grammarQ(+a,+c));}
      else if(k.startsWith('p:')){const p=findPast(k.slice(2));if(p)b.past.push(()=>pastQ(p));}
    });
    Object.keys(b).forEach(k=>b[k]=shuffle(b[k]));return b;
  }
  shuffle(isl.words).forEach((w,n)=>{const ty=['listen','zh2en','en2zh'][n%3];b[ty].push(()=>wordQ(ty,w,isl));});
  shuffle(isl.spell.filter(w=>/^[a-z]+$/i.test(w[0])&&w[0].length<=9)).forEach(w=>b.spell.push(()=>wordQ('spell',w,isl)));
  (isl.grammar||[]).forEach((g,gi)=>b.grammar.push(()=>grammarQ(ii,gi)));
  (isl.past||[]).forEach(p=>b.past.push(()=>pastQ(p)));
  (isl.phonics||[]).forEach(gp=>b.rhyme.push(()=>rhymeQ(isl,gp)));
  Object.keys(b).forEach(k=>b[k]=shuffle(b[k]));
  return b;
}
const ROT=['listen','grammar','zh2en','spell','past','en2zh','rhyme','grammar','listen','past','zh2en','spell','rhyme'];

  const waves=[{e:'😈',n:'錯題小惡魔',boss:false,max:h1},{e:'👿',n:'錯題大魔王',boss:true,max:Math.max(1,n-h1)}];

function nextQ(){
  B.count++;
  if(B.retry.length&&(B.count%3===0)){const f=B.retry.shift();B.q=f();B.q.maker=f;return;}
  for(let t=0;t<ROT.length*2;t++){
    const ty=ROT[B.rot++%ROT.length];
    if(B.bank[ty]&&B.bank[ty].length){const f=B.bank[ty].shift();B.q=f();B.q.maker=f;return;}
  }
  if(B.retry.length){const f=B.retry.shift();B.q=f();B.q.maker=f;return;}
  B.bank=buildBank(B.isl,B.ii);nextQ();
}
function qHTML(q){

  else if(q.big)h+=`<div class="qbig">${esc(q.big)} ${q.type==='spell'?sayBtn(q.say)+slowBtn(q.say):''}</div>`;

function answer(i){if(B.lock)return;resolve(B.q.options[i]===B.q.answer,i);}
function resolve(ok,idx){
  if(B.lock)return;B.lock=true;

  if(q.options)document.querySelectorAll('.opt').forEach((b,i)=>{if(q.options[i]===q.answer)b.classList.add('right');else if(i===idx)b.classList.add('wrong');b.disabled=true;});

    const d=document.createElement('div');d.className='dmg';d.textContent=B.combo>=3?`💥 ${sp.skills[r]}！`:(r>0?sp.skills[Math.max(0,r-1)]+'！':'命中！');a.appendChild(d);
    $('#mon').classList.add('hit');$('#hpbar').style.width=(w.hp/w.max*100)+'%';
    fb.className='feedback ok';fb.textContent=['答對了！','好厲害！','Great job!','太強了！','Perfect!'][Math.random()*5|0]+`  +${gain} 🪙`;
    if(B.review)delete S.wrong[q.log.k];
  }else{
    B.combo=0;B.hearts--;B.wrong++;sfx('bad');$('#bt').classList.add('hurt');
    $('.hearts').textContent='❤️'.repeat(Math.max(0,B.hearts))+'🖤'.repeat(B.max-Math.max(0,B.hearts));
    fb.className='feedback no';fb.innerHTML=`哎呀！正確答案是：<b>${esc(q.answer)}</b>`;
    logWrong(q.log);B.retry.push(q.maker);
  }
  if(q.after)setTimeout(()=>say(q.after),ok?150:350);
  save();
  const me=B;

    if(B!==me||!$('#bt'))return;
    B.lock=false;
    if(B.hearts<=0)return endBattle(false);
    if(w.hp<=0)return waveCleared();

  },ok?1500:2600);
}
function logWrong(l){if(!l)return;const o=S.wrong[l.k]||{en:l.en,zh:l.zh,n:0};o.n++;S.wrong[l.k]=o;}
function waveCleared(){

/* ---------- 拼字小工具（打怪和拼字練習共用） ---------- */
let SP=null;
function spInit(){
  const q=SP.q,ans=q.answer.toLowerCase().split('');
  const extra=shuffle('abcdefghijklmnopqrstuvwxyz'.split('').filter(c=>!ans.includes(c))).slice(0,ans.length>6?2:3);
  SP.tiles=shuffle([...ans,...extra]).map(c=>({c,used:false}));SP.picked=[];SP.state='';SP.hint=0;spRender();
}
function spRender(){
  const el=$('#spw');if(!el)return;const n=SP.q.answer.length;
  let slots='';for(let i=0;i<n;i++){const t=SP.picked[i];const c=t!=null?SP.tiles[t].c:(i<SP.hint?SP.q.answer[i].toLowerCase():'');slots+=`<div class="slot ${t!=null?'f':''} ${SP.state}">${c&&t==null?`<span style="opacity:.35">${c}</span>`:c}</div>`;}
  el.innerHTML=`<div class="slots">${slots}</div><div class="tiles">${SP.tiles.map((t,i)=>`<button class="tile" ${t.used||SP.state?'disabled':''} onclick="spTile(${i})">${t.c}</button>`).join('')}</div>
  <div class="sp-tools"><button class="btn ghost" onclick="spBack()" ${SP.state?'disabled':''}>⌫ 退一格</button><button class="btn ghost" onclick="spClear()" ${SP.state?'disabled':''}>↺ 重來</button>${SP.allowHint?`<button class="btn ghost" onclick="spHint()" ${SP.state?'disabled':''}>💡 提示</button>`:''}</div>`;
}
function spTile(i){if(!SP||SP.state||SP.tiles[i].used)return;SP.tiles[i].used=true;SP.picked.push(i);sfx('coin');
  if(SP.picked.length===SP.q.answer.length){const w=SP.picked.map(j=>SP.tiles[j].c).join('');const ok=w===SP.q.answer.toLowerCase();SP.state=ok?'ok':'no';spRender();SP.done(ok);}else spRender();}
function spBack(){if(!SP||SP.state||!SP.picked.length)return;SP.tiles[SP.picked.pop()].used=false;spRender();}
function spClear(){if(!SP||SP.state)return;SP.picked.forEach(j=>SP.tiles[j].used=false);SP.picked=[];spRender();}
function spHint(){if(!SP||SP.state)return;spClear();const need=SP.q.answer.toLowerCase()[SP.picked.length];const j=SP.tiles.findIndex(t=>!t.used&&t.c===need);if(j>=0)spTile(j);SP.hinted=true;}
document.addEventListener('keydown',e=>{
  if(!SP||!$('#spw')||SP.state)return;
  if(e.key==='Backspace'){e.preventDefault();spBack();return;}
  const k=e.key.toLowerCase();if(/^[a-z]$/.test(k)){const j=SP.tiles.findIndex(t=>!t.used&&t.c===k);if(j>=0)spTile(j);}
});

/* ---------- 發音挑戰（語音辨識） ---------- */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
const NUM={'0':'zero','1':'one','2':'two','3':'three','4':'four','5':'five','6':'six','7':'seven','8':'eight','9':'nine','10':'ten','11':'eleven','12':'twelve','20':'twenty'};
const SAME={gnat:['nat','knat','net'],gnaw:['naw','gnar','nor'],gnome:['nome','know','gnomes'],eight:['ate'],two:['to','too'],four:['for'],one:['won'],pear:['pair','pare'],bear:['bare'],tear:['tare','terror'],wear:['where','ware'],night:['knight'],sun:['son'],sign:['sine'],see:['sea'],bee:['be'],tea:['t','tee'],read:['red','reed'],made:['maid'],flower:['flour'],pe:['p.e','pee','p'],neigh:['nay','neigh'],sleigh:['slay'],ghoul:['ghoul','gool','goal'],high:['hi','hai'],cut:['cat'],tofu:['tofu'],art:['arts'],week:['weak'],heavy:['heavey'],lamb:['lam','lamp'],crumb:['crum','crump'],twig:['twig'],clay:['clay'],there:['their',"they're"],its:["it's"]};
function norm(s){return s.toLowerCase().replace(/[’']/g,'').replace(/-/g,' ').replace(/[^a-z0-9 ]/g,' ').split(/\s+/).filter(Boolean).map(x=>NUM[x]||x);}
function lev(a,b){const m=a.length,n=b.length;const d=Array.from({length:m+1},(_,i)=>[i,...Array(n).fill(0)]);for(let j=1;j<=n;j++)d[0][j]=j;for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[m][n];}
// 句子要嚴格（need / needs、look / looks 是文法重點）；單一單字才放寬，避免辨識誤差
function wordMatch(t,h,single){if(t===h)return true;if((SAME[t]||[]).includes(h))return true;if(!single)return false;if(t.length>=5&&lev(t,h)<=1)return true;if(t+'s'===h||h+'s'===t)return true;return false;}
function grade(target,alts){
  const tw=norm(target);let best={score:-1,marks:[]};
  alts.forEach(a=>{const hw=norm(a);const used=new Set();const marks=tw.map(t=>{const j=hw.findIndex((h,k)=>!used.has(k)&&wordMatch(t,h,tw.length===1));if(j>=0){used.add(j);return true;}return false;});const sc=marks.filter(Boolean).length/tw.length;if(sc>best.score)best={score:sc,marks,heard:a};});
  return best;
}
let K=null;
function startSpeak(ii){

  K={ii,items:[...ws,...gs,...rs],idx:0,scores:[]};renderSpeak();
}
function renderSpeak(){

    const p=prog(isl.id);const rec=total>p.speak;p.speak=Math.max(p.speak,total);const gain=Math.round(total/10);S.coins+=gain;if(total>0)gainXp(30);save();sfx('win');if(total>=60)confetti(20);
    app.innerHTML=`${topbar()}<div class="panel center"><h1>🎤 發音挑戰完成！</h1><div class="bigstars">${total} 分</div><p>${rec?'🏅 新紀錄！':''}獲得 🪙${gain}</p><p class="sub">${total>=80?'發音超標準！老師一定會稱讚你 👍':total>=50?'很不錯！多聽幾次 🐢 慢速再跟著唸':'先按 🔊 多聽幾次，跟著唸會越來越好！'}</p><div class="row"><button class="btn" onclick="startSpeak(${K.ii})">🔁 再挑戰</button><button class="btn ghost" onclick="renderIsland(${K.ii})">🏝️ 回到島上</button></div></div>`;return;}
  const it=K.items[K.idx];
  app.innerHTML=`${topbar()}<div class="panel"><button class="back" onclick="renderIsland(${K.ii})">← ${isl.name}</button>
  <div class="prog"><div style="width:${K.idx/K.items.length*100}%"></div></div><p class="sub center">第 ${K.idx+1} / ${K.items.length} 題・先聽，再按麥克風說出來</p>
  <div class="sp-target" id="tg">${norm2words(it.t).map(w=>`<span class="w">${esc(w)}</span>`).join(' ')}</div>
  <div class="sp-zh">${esc(it.zh)}</div><br>

  <div class="heard" id="heard">${SR?'':'⚠️ 這個瀏覽器不能聽你說話，請用 Chrome 或 Edge 開。現在可以唸完自己評分：'}</div>
  <div class="bigstars" id="bs"></div>

  setTimeout(()=>say(it.t),300);
}
function norm2words(t){return t.split(/\s+/);}
let REC=null,RECDONE=null;
function showGrade(it,alts){
  const hd=$('#heard');const g=grade(it.t,alts);
  const spans=document.querySelectorAll('#tg .w');
  let mi=0;spans.forEach(s=>{const n=norm(s.textContent).length;if(!n)return;const ok=g.marks.slice(mi,mi+n).every(Boolean);s.className='w '+(ok?'ok':'no');mi+=n;});
  const st=g.score>=.9?3:g.score>=.6?2:g.score>0.25?1:0;
  hd.innerHTML=`我聽到：「<b>${esc(g.heard||'')}</b>」`;
  $('#bs').textContent=st?'⭐'.repeat(st):'😅 再試一次！';
  st>=2?sfx('hit'):sfx('bad');
  const key=it.t;const prev=S.speakBest[key]||0;if(st===3&&prev<3){S.coins+=3;toast('三顆星！+3 🪙');}S.speakBest[key]=Math.max(prev,st);save();
  $('#nx').innerHTML=`<button class="btn ghost" onclick="listen()">🔁 再說一次</button><button class="btn green" onclick="speakNext(${g.score})">下一題 ➜</button>`;
}
// 辨識不到時，不讓孩子卡住：可以再試、自己評分或跳過
function speakFail(msg){
  const hd=$('#heard');if(!hd)return;hd.innerHTML=msg;$('#bs').textContent='';
  $('#nx').innerHTML=`<button class="btn" onclick="listen()">🎤 再試一次</button><button class="btn green" onclick="speakNext(1)">😀 我有唸好</button><button class="btn ghost" onclick="speakNext(0)">跳過 ➜</button>`;
}
function listen(){
  if(!SR){speakFail('⚠️ 這個瀏覽器不能聽你說話。<br>iPad／iPhone 請用 <b>Safari</b>，電腦請用 <b>Chrome</b> 或 <b>Edge</b>；從 LINE 點開的話，請按右下角改用瀏覽器開啟。');return;}
  if(REC){if(RECDONE)RECDONE();return;} // 再按一次＝我說完了
  try{speechSynthesis.cancel();}catch(e){}
  const it=K.items[K.idx],mic=$('#mic'),hd=$('#heard');
  const nWords=norm(it.t).length,isSent=nWords>1;
  // 句子：連續收音，停頓 3 秒才算說完；單字：停 1.8 秒
  const QUIET=isSent?3000:1800,MAXMS=isSent?20000:9000;
  const r=new SR();REC=r;r.lang='en-US';r.interimResults=true;r.continuous=isSent;r.maxAlternatives=5;
  let alts=[],done=false,heardSound=false,errMsg='',quiet=null,maxT=null;
  const reset=()=>{REC=null;RECDONE=null;clearTimeout(quiet);clearTimeout(maxT);if(mic){mic.classList.remove('on');mic.textContent='🎤 換我說';}};
  const finish=()=>{
    if(done)return;done=true;try{r.stop();}catch(e){}reset();
    if(K.items[K.idx]!==it)return;
    if(alts.length&&alts[0].trim())showGrade(it,alts);
    else speakFail(errMsg||(heardSound?'有聽到聲音，但沒聽清楚 🤔 靠近一點、慢慢大聲說一次':'😶 麥克風沒有收到聲音。<br>請確認：① 有按「允許」麥克風　② 平板沒有靜音或接著藍牙耳機　③ 靠近一點大聲說'));
  };
  RECDONE=finish;
  mic.classList.add('on');mic.textContent='✋ 說完按這裡';hd.textContent='準備中…請等一下';if(isSent)document.querySelectorAll('#tg .w').forEach(x=>x.className='w');$('#bs').textContent='';
  r.onstart=()=>{hd.innerHTML='🎙️ <b>現在請大聲說出上面的英文！</b>';};
  r.onaudiostart=()=>{heardSound=true;};
  r.onspeechstart=()=>{heardSound=true;hd.innerHTML='👂 有聽到你的聲音，繼續說…';};
  r.onresult=e=>{
    const list=[...e.results];const full=list.map(x=>x[0].transcript).join(' ').trim();
    alts=list.length===1?[...list[0]].map(a=>a.transcript):[full];
    if(full)hd.innerHTML='👂 '+esc(full)+(isSent?'<br><small>慢慢唸完，唸完按「✋ 說完按這裡」</small>':'');
    if(isSent&&full){ // 邊唸邊把唸對的字變綠
      const g=grade(it.t,alts.concat([full]));let mi=0;
      document.querySelectorAll('#tg .w').forEach(x=>{const n=norm(x.textContent).length;if(!n)return;if(g.marks.slice(mi,mi+n).every(Boolean))x.className='w ok';mi+=n;});
      if(g.score>=1){clearTimeout(quiet);quiet=setTimeout(finish,700);return;}
    }
    clearTimeout(quiet);
    if(!isSent&&list[list.length-1].isFinal)finish();else quiet=setTimeout(finish,QUIET);
  };
  r.onerror=e=>{
    const m={'not-allowed':'⚠️ 麥克風被擋住了。請按網址列的「aA」或🔒圖示，把麥克風改成「允許」，再重新整理頁面。','service-not-allowed':'⚠️ 這台裝置沒有開語音辨識。iPad／iPhone 請到「設定 → 一般 → 鍵盤」打開「聽寫」，再回來試。','no-speech':'沒聽到聲音，靠近一點再大聲說一次 🙂','audio-capture':'⚠️ 找不到麥克風，請確認平板或電腦的麥克風可以用。','network':'⚠️ 語音辨識需要網路，請確認有連上網路。'};
    if(e.error!=='aborted')errMsg=m[e.error]||('出了點問題（'+esc(e.error)+'），再按一次試試看');
    if(e.error!=='aborted'&&!alts.length)finish();
  };
  r.onend=()=>{if(!done)finish();};
  maxT=setTimeout(finish,MAXMS);
  try{r.start();}catch(e){errMsg='麥克風啟動失敗，再按一次試試看';finish();}
}
function speakNext(sc){if(REC){try{REC.abort();}catch(e){}REC=null;RECDONE=null;}K.scores.push(sc);K.idx++;renderSpeak();}

/* ---------- 商店、圖鑑、家長說明 ---------- */
function renderShop(){
  music('map');
  const sp=SPORTS[S.hero??0],r=rankIdx(),l=level();
  const nextQ=r<5?Math.ceil((lvlXp(RANK_LV[r+1])-S.xp)/10):0;
  app.innerHTML=`${topbar()}<div class="panel"><button class="back" onclick="renderMap()">← 回地圖</button>
  <h2>🏟️ 球員休息室</h2>
  <div class="locker"><div class="locker-ava">${heroHTML(150)}</div><div>
   <h2>${esc(S.name)}・${sp.titles[r]}</h2><p>Lv.${l}　背號 ${esc(S.num)}</p>
   <p>目前絕招：<b>${sp.ball} ${sp.skills[r]}</b>（連續答對 3 題就會發動！）</p>
   ${r<5?`<p class="tip">再答對大約 <b>${nextQ}</b> 題，就能晉級成「<b>${sp.titles[r+1]}</b>」！</p>`:'<p class="tip">🏆 你已經是傳奇球星了！</p>'}
  </div></div>
  <h3>🪜 晉級之路</h3>
  <div class="ranks">${sp.titles.map((t,i)=>`<div class="${i<=r?'':'lock'} ${i===r?'cur':''}">${avatarSVG(S.hero??0,i,S.num,64)}<b>${t}</b><small>Lv.${RANK_LV[i]}・${sp.skills[i]}</small></div>`).join('')}</div>
  <h3>🛒 裝備商店</h3><p class="sub">打怪、練習都能賺金幣，買裝備讓球員更帥！</p>
  <div class="shop">${SHOP.map((s,i)=>{const own=S.owned.includes(i),on=S.wear.includes(i);return `<div><span>${s[0]}</span><b>${s[1]}</b><br>${own?`<button class="btn ${on?'green':'ghost'}" onclick="wear(${i})">${on?'✅ 穿戴中':'穿上'}</button>`:`<button class="btn" onclick="buy(${i})">🪙 ${s[2]}</button>`}</div>`;}).join('')}</div>
  <br><div class="center"><button class="btn ghost" onclick="pickH=S.hero;renderStart()">🔄 換球員、名字或背號</button></div></div>`;
}
function buy(i){if(S.coins<SHOP[i][2]){toast(`還差 ${SHOP[i][2]-S.coins} 金幣，去打怪賺吧！`);return;}S.coins-=SHOP[i][2];S.owned.push(i);S.wear.push(i);save();sfx('win');confetti(15);renderShop();}
function wear(i){S.wear=S.wear.includes(i)?S.wear.filter(x=>x!==i):[...S.wear,i];save();renderShop();}
function renderDex(){
  music('map');
  let h='';ISLANDS.forEach((isl,ii)=>isl.monsters.forEach((m,k)=>{const got=S.monsters.includes(ii+'-'+k);h+=`<div class="${got?'':'lock'}"><span>${m[0]}</span><b>${got?esc(m[1]):'？？？'}</b><br><small>${isl.name}${k===2?'・魔王':''}</small></div>`;}));
  app.innerHTML=`${topbar()}<div class="panel"><button class="back" onclick="renderMap()">← 回地圖</button><h2>📖 怪物圖鑑 ${S.monsters.length}/24</h2><p class="sub">打倒怪物就會收進圖鑑，全部收集就是英文大師！</p><div class="dex">${h}</div></div>`;
}
function renderHelp(){
  music('map');
  const wr=Object.values(S.wrong).sort((a,b)=>b.n-a.n).slice(0,30);
  app.innerHTML=`${topbar()}<div class="panel help"><button class="back" onclick="renderMap()">← 回地圖</button><h2>👨‍👩‍👦 家長說明</h2>
  <ul>
   <li><b>內容來源：</b>何嘉仁美語聯絡簿 2026/8/31～11/6 的單字、拼字、文法句型和 Phonics 練習句，整理成 8 座島。</li>
   <li><b>四種玩法：</b>⚔️ 打怪（聽力、中翻英、英翻中、文法填空、拼字、過去式、發音規則混合出題）、🃏 單字卡、✏️ 拼字（可用實體鍵盤）、🎤 發音挑戰（用麥克風評分）。</li>
   <li><b>建議用 Chrome 或 Edge 開：</b>發音朗讀和麥克風評分需要瀏覽器支援，第一次會詢問麥克風權限，請按「允許」。語音辨識需要連網。</li>
   <li><b>進度存在這台電腦的瀏覽器</b>，換電腦或清除瀏覽資料就會從頭開始。</li>
   <li><b>錯題本：</b>答錯的題目會自動收集，到地圖的「💢 錯題復仇戰」再練，答對就會從清單移除。</li>
  </ul>
  <h3>目前最常錯的（${Object.keys(S.wrong).length} 題）</h3>
  ${wr.length?`<div class="wl">${wr.map(w=>`<button data-say="${esc(w.en.replace(' → ',', '))}">🔊 ${esc(w.en)}<i>${esc(w.zh)}・錯 ${w.n} 次</i></button>`).join('')}</div>`:'<p class="sub">還沒有錯題 👍</p>'}
  <br><button class="btn ghost" onclick="resetAll()">🗑️ 重設所有進度</button></div>`;
}
function resetAll(){if(confirm('確定要清除所有星星、金幣、裝備和錯題紀錄嗎？這個動作不能復原。')){const n=S.name,h=S.hero;S=defaultSave();S.name=n;S.hero=h;save();renderMap();toast('已重設進度');}}

/* ---------- 啟動 ---------- */
S.hero==null?renderStart():renderMap();
</script>
